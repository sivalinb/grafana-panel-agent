services:
  exporter:
    image: python:3.12-slim
    command: ["python", "/demo/exporter.py", "--host", "0.0.0.0"]
    volumes: ["./demo:/demo:ro"]
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    depends_on: [exporter]
  grafana:
    image: grafana/grafana:12.3.6
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-demo-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes: ["grafana-data:/var/lib/grafana"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on: [prometheus]
  guardian:
    build: .
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["guardian-data:/app/data"]
    environment:
      GUARDIAN_GRAFANA_URL: http://grafana:3000
      GUARDIAN_DATA_DIR: /app/data
      DEMO_PROMETHEUS_URL: http://prometheus:9090
    command: ["sh", "-c", "python3 scripts/compose_config.py && python3 scripts/bootstrap.py --config /app/data/config.json && sleep 8 && python3 -m guardian serve --config /app/data/config.json"]
    depends_on:
      grafana: {condition: service_healthy}
volumes:
  prometheus-data:
  grafana-data:
  guardian-data:
